plugins { id 'com.android.application' }

def host = 'killershrekmath.vercel.app'
def env = System.getenv()

android {
    namespace 'com.shrekmath.killermath'
    compileSdk 36

    defaultConfig {
        applicationId 'com.shrekmath.killermath'   // 플레이스토어 패키지 이름 — 한 번 올리면 바꿀 수 없음
        minSdk 21
        targetSdk 36
        versionCode((env.VERSION_CODE ?: '1') as int)
        versionName env.VERSION_NAME ?: '1.0'
        manifestPlaceholders = [hostName: host, launchUrl: "https://${host}/"]
        resValue 'string', 'app_name', '킬러들의 수학몰'
        resValue 'string', 'asset_statements',
            "[{ \\\"relation\\\": [\\\"delegate_permission/common.handle_all_urls\\\"], \\\"target\\\": {\\\"namespace\\\": \\\"web\\\", \\\"site\\\": \\\"https://${host}\\\"}}]"
    }

    signingConfigs {
        release {
            if (env.KEYSTORE_FILE) {
                storeFile file(env.KEYSTORE_FILE)
                storePassword env.KEYSTORE_PASSWORD
                keyAlias env.KEY_ALIAS
                keyPassword env.KEY_PASSWORD
            }
        }
    }
    buildTypes {
        release {
            minifyEnabled false
            if (env.KEYSTORE_FILE) signingConfig signingConfigs.release
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    implementation 'com.google.androidbrowserhelper:androidbrowserhelper:2.5.0'
    implementation 'com.google.androidbrowserhelper:billing:1.2.0'   // Google Play 결제 (Digital Goods API)
}
