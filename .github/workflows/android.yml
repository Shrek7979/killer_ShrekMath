# 안드로이드 앱(TWA) 빌드: android/ 가 바뀌거나 Actions 탭에서 직접 실행하면
#  - 서명 전 AAB (플레이스토어 업로드용 — 업로드 키로 따로 서명해서 올린다)
#  - 디버그 APK (휴대폰에 바로 설치해 보는 테스트용)
# 를 만든다. 서명 키는 저장소에 두지 않는다.
name: Android app

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['android/**', '.github/workflows/android.yml']

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.14.3'
      - name: AAB·APK 빌드
        env:
          VERSION_CODE: ${{ github.run_number }}
          VERSION_NAME: 1.0.${{ github.run_number }}
        run: gradle -p android bundleRelease assembleDebug --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: killermath-${{ github.run_number }}
          path: |
            android/app/build/outputs/bundle/release/*.aab
            android/app/build/outputs/apk/debug/*.apk
